<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vorbe</title>
    <link rel="icon" type="image/png" href="res/VorbeTabIcon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.11/lib/marked.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js"></script>
    <style>
        :root[data-theme="light"] {
            --bg: #ffffff;
            --bg-panel: #f7f7f8;
            --border: #e3e3e6;
            --text: #0d0d0d;
            --text-secondary: #6e6e77;
            --accent-bg: #0d0d0d;
            --accent-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        :root[data-theme="dark"] {
            --bg: #121212;
            --bg-panel: #1c1c1e;
            --border: #2e2e32;
            --text: #f2f2f3;
            --text-secondary: #9a9aa2;
            --accent-bg: #f2f2f3;
            --accent-text: #0d0d0d;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        html {
            --brand: #a13dff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
        }

        .brand-mark {
            height: 44px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .brand-mark img {
            height: 26px;
            width: auto;
            display: block;
        }

        /* Logo art is white shapes on a transparent background - invisible on
           a light page unless inverted. Dark mode needs no change. */
        :root[data-theme="light"] .brand-mark img {
            filter: invert(1) brightness(0.1);
        }

        .brand-sub {
            margin-top: 8px;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        .sidebar-footer {
            margin-top: auto;
            font-size: 0.78em;
        }

        .sidebar-footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .sidebar-footer a:hover {
            color: var(--text);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-title {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .theme-toggle {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .theme-toggle:hover {
            background: var(--border);
            transform: scale(1.08);
        }

        .theme-toggle img {
            width: 16px;
            height: 16px;
        }

        /* Icon art is white shapes on a transparent background - invisible on
           a light page unless inverted. Dark mode needs no change. */
        :root[data-theme="light"] .theme-toggle img {
            filter: invert(1) brightness(0.1);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            line-height: 1.55;
            word-wrap: break-word;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-image {
            display: block;
            max-width: 240px;
            max-height: 240px;
            border-radius: 8px;
            margin-bottom: 6px;
            object-fit: cover;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 6px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: typingBounce 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        .user-message {
            align-self: flex-end;
            max-width: 80%;
            background: var(--accent-bg);
            color: var(--accent-text);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .assistant-message {
            align-self: stretch;
            color: var(--text);
        }

        .assistant-message.error {
            border: 1px dashed var(--text-secondary);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-secondary);
        }

        code {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        pre {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 8px;
        }

        pre code {
            border: none;
            padding: 0;
            background: none;
        }

        /* Markdown elements rendered from chat messages (marked.js output) */
        .assistant-message h1,
        .assistant-message h2,
        .assistant-message h3,
        .assistant-message h4 {
            margin: 16px 0 8px;
            line-height: 1.3;
        }

        .assistant-message h1 { font-size: 1.4em; }
        .assistant-message h2 { font-size: 1.2em; }
        .assistant-message h3 { font-size: 1.05em; }
        .assistant-message h4 { font-size: 1em; }

        .assistant-message p {
            margin: 8px 0;
        }

        .assistant-message ul,
        .assistant-message ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .assistant-message li {
            margin: 4px 0;
        }

        .assistant-message a {
            color: var(--text);
            text-decoration: underline;
        }

        .assistant-message blockquote {
            margin: 8px 0;
            padding: 4px 12px;
            border-left: 3px solid var(--border);
            color: var(--text-secondary);
        }

        .assistant-message hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 16px 0;
        }

        .assistant-message table {
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 0.9em;
            display: block;
            overflow-x: auto;
        }

        .assistant-message th,
        .assistant-message td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }

        .assistant-message th {
            background: var(--bg-panel);
            font-weight: 600;
        }

        .input-area {
            border-top: 1px solid var(--border);
            padding: 16px 24px 20px;
        }

        .input-shell {
            max-width: 760px;
            margin: 0 auto;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px 10px;
            background: var(--bg);
        }

        .input-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            position: relative;
        }

        .attachment-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8em;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .attachment-chip[hidden] {
            display: none;
        }

        .attachment-chip button {
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.1em;
            line-height: 1;
            padding: 0;
        }

        .attachment-chip button:hover {
            color: var(--text);
        }

        .icon-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1.1em;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .icon-btn:hover:not(:disabled) {
            background: var(--border);
            transform: scale(1.08);
        }

        .icon-btn:disabled,
        .skill-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .skill-btn {
            height: 30px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.85em;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .skill-btn:hover {
            background: var(--border);
            transform: scale(1.05);
        }

        .skill-icon-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .skill-icon-badge img {
            width: 14px;
            height: 14px;
        }

        /* Icon art is white shapes on a transparent background - invisible on
           a light page unless inverted, now that there's no colored badge
           behind them. Dark mode needs no change. */
        :root[data-theme="light"] .skill-icon-badge img {
            filter: invert(1) brightness(0.1);
        }

        .skill-menu {
            position: absolute;
            bottom: 38px;
            left: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 4px 16px var(--shadow);
            min-width: 220px;
            overflow: hidden;
            z-index: 10;
        }

        .skill-menu[hidden] {
            display: none;
        }

        .skill-option {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            border: none;
            background: none;
            font-size: 0.9em;
            color: var(--text);
            cursor: pointer;
        }

        .skill-option:hover {
            background: var(--border);
        }

        .skill-option.active {
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-row textarea {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1em;
            padding: 8px 6px;
            font-family: inherit;
            color: var(--text);
            background: transparent;
            resize: none;
            max-height: 160px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .input-row textarea:disabled {
            opacity: 0.6;
        }

        .send-btn {
            width: 34px;
            height: 34px;
            background: var(--accent-bg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .send-btn:hover:not(:disabled) {
            opacity: 0.85;
            transform: scale(1.08);
        }

        .send-btn img {
            width: 16px;
            height: 16px;
        }

        /* Icon asset is white. In light mode the button background is black,
           so the white icon already reads correctly. In dark mode the button
           background flips to near-white, so the icon needs to invert to dark. */
        :root[data-theme="dark"] .send-btn img {
            filter: invert(1) brightness(0.1);
        }

        @media (max-width: 640px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark"><img src="res/VorbeBannerLogo.png" alt="Vorbe"></div>
            </div>
            <div class="brand-sub">AI coding assistant for Vortex</div>
            <div class="sidebar-footer"><a href="/terms">Terms of Service</a></div>
        </aside>

        <div class="main">
            <div class="chat-header">
                <div class="chat-header-title">Vorbe</div>
                <button class="theme-toggle" id="themeToggle" type="button" title="Toggle theme" aria-label="Toggle theme">
                    <img id="themeIcon" src="res/Moon.png" alt="">
                </button>
            </div>

            <div class="messages" id="messages" aria-live="polite"></div>

            <div class="input-area">
                <div class="input-shell">
                    <div class="attachment-chip" id="attachmentChip" hidden>
                        <span id="attachmentChipName"></span>
                        <button type="button" id="attachmentRemove" aria-label="Remove attachment" title="Remove attachment">&times;</button>
                    </div>
                    <div class="input-toolbar">
                        <input type="file" id="fileInput" hidden accept="image/*,.lua,.luau">
                        <button class="icon-btn" id="attachBtn" type="button" title="Attach a file" aria-label="Attach a file">+</button>
                        <button class="skill-btn" id="skillBtn" type="button">
                            <span class="skill-icon-badge" id="skillBtnIcon"></span>
                            <span id="skillBtnLabel">Skill: Script generation</span>
                        </button>
                        <div class="skill-menu" id="skillMenu" hidden></div>
                    </div>
                    <div class="input-row">
                        <textarea
                            id="input"
                            rows="1"
                            placeholder="Describe what you want to create or fix..."
                        ></textarea>
                        <button class="send-btn" id="sendBtn" onclick="handleSendClick()" aria-label="Send" title="Send">
                            <img id="sendBtnIcon" src="res/Send.png" alt="">
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Theme ---
        function getPreferredTheme() {
            const stored = localStorage.getItem("vorbe-theme");
            if (stored === "light" || stored === "dark") return stored;
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            document.getElementById("themeIcon").src = theme === "dark" ? "res/Sun.png" : "res/Moon.png";
            localStorage.setItem("vorbe-theme", theme);
        }

        applyTheme(getPreferredTheme());

        document.getElementById("themeToggle").addEventListener("click", () => {
            const current = document.documentElement.getAttribute("data-theme");
            applyTheme(current === "dark" ? "light" : "dark");
        });

        // --- Backend ---
        // Same Vercel deployment as this page, so relative paths just work -
        // locally via `vercel dev`, in production automatically.
        const API_URL = "";
        const API_TOKEN = ""; // set to match API_AUTH_TOKEN if you configured one

        const TASK_OPTIONS = [
            ["script_generation", "Script generation", "res/Script.png"],
            ["bug_fixing", "Bug fixing", "res/Bug.png"],
            ["documentation", "Documentation", "res/Docs.png"],
            // World generation disabled for now - re-enable this line once ready.
            // ["world_generation", "World generation", "res/GenerateWorld.png"],
            ["security_review", "Security review", "res/Lock.png"],
        ];

        let currentTask = "script_generation";
        let isLoading = false;

        const skillBtn = document.getElementById("skillBtn");
        const skillBtnIcon = document.getElementById("skillBtnIcon");
        const skillBtnLabel = document.getElementById("skillBtnLabel");
        const skillMenu = document.getElementById("skillMenu");

        function renderSkillMenu() {
            skillMenu.innerHTML = "";
            for (const [value, label, icon] of TASK_OPTIONS) {
                const btn = document.createElement("button");
                btn.className = "skill-option" + (value === currentTask ? " active" : "");
                btn.innerHTML = `<span class="skill-icon-badge"><img src="${icon}" alt=""></span><span></span>`;
                btn.querySelector("span:last-child").textContent = label;
                btn.onclick = () => {
                    currentTask = value;
                    skillBtnIcon.innerHTML = `<img src="${icon}" alt="">`;
                    skillBtnLabel.textContent = `Skill: ${label}`;
                    skillMenu.hidden = true;
                    renderSkillMenu();
                };
                skillMenu.appendChild(btn);
            }
        }
        renderSkillMenu();
        skillBtnIcon.innerHTML = `<img src="${TASK_OPTIONS[0][2]}" alt="">`;

        skillBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            skillMenu.hidden = !skillMenu.hidden;
        });

        document.addEventListener("click", () => {
            skillMenu.hidden = true;
        });

        // --- Attachment ---
        const MAX_ATTACHMENT_CHARS = 20000;
        // Groq's own cap for inline base64 images is 4MB; stay comfortably under it.
        const MAX_IMAGE_DATA_URL_BYTES = 3 * 1024 * 1024;
        let attachedFile = null; // { kind: 'text'|'image', name, content?, dataUrl? }

        const fileInput = document.getElementById("fileInput");
        const attachBtn = document.getElementById("attachBtn");
        const attachmentChip = document.getElementById("attachmentChip");
        const attachmentChipName = document.getElementById("attachmentChipName");

        const CODE_EXTENSIONS = [".lua", ".luau"];
        // .vrtx/.json are temporarily disabled while the format is still being
        // reverse-engineered - re-enable by moving them into CODE_EXTENSIONS
        // (or a dedicated handler) once that's stable.
        const DISABLED_EXTENSIONS = [".vrtx", ".json"];

        function extensionOf(filename) {
            const i = filename.lastIndexOf(".");
            return i === -1 ? "" : filename.slice(i).toLowerCase();
        }

        attachBtn.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            fileInput.value = ""; // allow re-selecting the same file later
            if (!file) return;

            const ext = extensionOf(file.name);

            if (DISABLED_EXTENSIONS.includes(ext)) {
                addMessage(`Attaching ${ext} files is temporarily disabled.`, "assistant", true);
                return;
            }

            if (CODE_EXTENSIONS.includes(ext)) {
                readCodeFile(file);
            } else if (file.type.startsWith("image/") || /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(file.name)) {
                readImageFile(file);
            } else {
                addMessage(`That file type isn't supported. Attach an image or a ${CODE_EXTENSIONS.join("/")} file.`, "assistant", true);
            }
        });

        function readCodeFile(file) {
            const reader = new FileReader();
            reader.onload = () => {
                let content = String(reader.result);
                let truncated = false;
                if (content.length > MAX_ATTACHMENT_CHARS) {
                    content = content.slice(0, MAX_ATTACHMENT_CHARS);
                    truncated = true;
                }
                attachedFile = { kind: "text", name: file.name, content, truncated };
                attachmentChipName.textContent = file.name + (truncated ? " (truncated)" : "");
                attachmentChip.hidden = false;
            };
            reader.onerror = () => {
                addMessage(`Couldn't read ${file.name} as text.`, "assistant", true);
            };
            reader.readAsText(file);
        }

        function readImageFile(file) {
            compressImage(file)
                .then((dataUrl) => {
                    attachedFile = { kind: "image", name: file.name, dataUrl };
                    attachmentChipName.textContent = file.name;
                    attachmentChip.hidden = false;
                })
                .catch(() => {
                    addMessage(`Couldn't process ${file.name} as an image.`, "assistant", true);
                });
        }

        // Resizes to a reasonable max dimension and re-encodes as JPEG so
        // uploaded images stay well under Groq's inline base64 size limit.
        function compressImage(file, maxDim = 1280, startQuality = 0.75) {
            return new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();

                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);

                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        const scale = maxDim / Math.max(width, height);
                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                    }

                    const canvas = document.createElement("canvas");
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);

                    let quality = startQuality;
                    let dataUrl = canvas.toDataURL("image/jpeg", quality);
                    while (dataUrl.length > MAX_IMAGE_DATA_URL_BYTES && quality > 0.3) {
                        quality -= 0.1;
                        dataUrl = canvas.toDataURL("image/jpeg", quality);
                    }

                    if (dataUrl.length > MAX_IMAGE_DATA_URL_BYTES) {
                        reject(new Error("Image too large even after compression"));
                        return;
                    }

                    resolve(dataUrl);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error("Couldn't decode image"));
                };
                img.src = objectUrl;
            });
        }

        function clearAttachment() {
            attachedFile = null;
            attachmentChip.hidden = true;
        }

        document.getElementById("attachmentRemove").addEventListener("click", clearAttachment);

        // --- Input box: auto-grow + Enter to send, Shift+Enter for a newline ---
        const inputEl = document.getElementById("input");

        function autoGrowInput() {
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
        }
        inputEl.addEventListener("input", autoGrowInput);

        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                handleSendClick();
            }
        });

        // Single newlines read as line breaks in chat responses, matching
        // how most AI assistants format text (not strict CommonMark, which
        // needs a blank line for a new paragraph).
        marked.setOptions({ breaks: true, gfm: true });

        let activeAbortController = null;

        function setLoading(loading) {
            isLoading = loading;
            const sendBtnIcon = document.getElementById("sendBtnIcon");
            const sendBtn = document.getElementById("sendBtn");
            sendBtnIcon.src = loading ? "res/Stop.png" : "res/Send.png";
            sendBtn.title = loading ? "Stop" : "Send";
            sendBtn.setAttribute("aria-label", loading ? "Stop" : "Send");
            // The send button stays enabled (it doubles as Stop); everything
            // else that could start a second, overlapping request gets locked.
            inputEl.disabled = loading;
            attachBtn.disabled = loading;
            skillBtn.disabled = loading;
        }

        function handleSendClick() {
            if (isLoading) {
                if (activeAbortController) activeAbortController.abort();
            } else {
                send();
            }
        }

        async function send() {
            const message = inputEl.value.trim();

            if ((!message && !attachedFile) || isLoading) return;

            const isImageAttachment = attachedFile && attachedFile.kind === "image";
            // An image thumbnail renders in the bubble itself, so it doesn't
            // need the "[Attached: name]" text too - a text/code attachment
            // has no visual, so it still gets the label.
            const displayText = attachedFile && !isImageAttachment
                ? `${message}\n\n[Attached: ${attachedFile.name}]`.trim()
                : message;
            addMessage(displayText, "user", false, isImageAttachment ? attachedFile.dataUrl : null);

            let prompt = message;
            let image = null;
            if (attachedFile) {
                if (attachedFile.kind === "text") {
                    prompt = `Attached file: ${attachedFile.name}\n\`\`\`\n${attachedFile.content}\n\`\`\`\n\n${message}`;
                } else if (attachedFile.kind === "image") {
                    prompt = message || "Describe what's shown in this image.";
                    image = attachedFile.dataUrl;
                }
            }
            clearAttachment();

            inputEl.value = "";
            autoGrowInput();
            setLoading(true);
            activeAbortController = new AbortController();
            const typingEl = addTypingIndicator();

            try {
                const response = await fetch(`${API_URL}/generate`, {
                    method: "POST",
                    signal: activeAbortController.signal,
                    headers: {
                        "Content-Type": "application/json",
                        ...(API_TOKEN ? { "Authorization": `Bearer ${API_TOKEN}` } : {})
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        task_type: currentTask,
                        max_tokens: 6000,
                        temperature: 0.7,
                        ...(image ? { image } : {})
                    })
                });

                typingEl.remove();

                if (!response.ok) {
                    if (response.status === 429) {
                        throw new Error("You're sending messages too fast - wait a moment and try again.");
                    }
                    // FastAPI's HTTPException responses carry the real reason
                    // in `detail` - surface that instead of a bare status code.
                    let detail = `Something went wrong (HTTP ${response.status}).`;
                    try {
                        const errBody = await response.json();
                        if (errBody && errBody.detail) detail = errBody.detail;
                    } catch { /* body wasn't JSON - keep the generic message */ }
                    throw new Error(detail);
                }

                const data = await response.json();
                addMessage(data.response, "assistant");
            } catch (error) {
                typingEl.remove();
                if (error.name === "AbortError") {
                    addMessage("Stopped.", "assistant");
                } else if (error instanceof TypeError) {
                    // fetch() itself rejected before a response came back -
                    // offline, DNS failure, CORS, etc.
                    addMessage("Couldn't reach the server. Check your connection and try again.", "assistant", true);
                } else {
                    addMessage(error.message, "assistant", true);
                }
            } finally {
                activeAbortController = null;
                setLoading(false);
                inputEl.focus();
            }
        }

        function addTypingIndicator() {
            const messagesDiv = document.getElementById("messages");
            const el = document.createElement("div");
            el.className = "message assistant-message typing-indicator";
            el.innerHTML = "<span class=\"typing-dot\"></span><span class=\"typing-dot\"></span><span class=\"typing-dot\"></span>";
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return el;
        }

        function addMessage(text, role, isError = false, imageDataUrl = null) {
            const messagesDiv = document.getElementById("messages");
            const messageEl = document.createElement("div");
            messageEl.className = `message ${role}-message` + (isError ? " error" : "");

            if (imageDataUrl) {
                const thumb = document.createElement("img");
                thumb.src = imageDataUrl;
                thumb.className = "message-image";
                thumb.alt = "Attached image";
                messageEl.appendChild(thumb);
            }

            if (role === "assistant") {
                const textEl = document.createElement("div");
                // Full markdown rendering (headings, bold, tables, lists, code,
                // links, etc.), then sanitized - marked doesn't escape anything
                // on its own, so untrusted text (the model's output) could
                // otherwise inject arbitrary HTML/JS. Falls back to a plain
                // notice if the backend ever returns an empty response.
                const html = marked.parse(text || "_No response received._");
                textEl.innerHTML = DOMPurify.sanitize(html);
                messageEl.appendChild(textEl);
            } else if (text) {
                // Plain text for the user's own message - markdown-rendering
                // their literal input would mangle things like variable_names
                // or math like (a * b) into unintended emphasis.
                const textEl = document.createElement("div");
                textEl.textContent = text;
                textEl.style.whiteSpace = "pre-wrap";
                messageEl.appendChild(textEl);
            }

            messagesDiv.appendChild(messageEl);

            if (role === "assistant") {
                // Scroll so the top of the new reply is visible instead of
                // snapping straight to the bottom - a long answer's opening
                // line would otherwise scroll straight past the viewport.
                messageEl.scrollIntoView({ behavior: "smooth", block: "start" });
            } else {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            return messageEl;
        }

        document.addEventListener("DOMContentLoaded", () => {
            addMessage("Welcome to Vorbe. Pick a skill and describe what you need.", "assistant");
            inputEl.focus();
        });
    </script>
</body>
</html>
